services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dais_postgres
    environment:
      POSTGRES_USER: dais
      POSTGRES_PASSWORD: dais_dev_password
      POSTGRES_DB: dais_erp
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: dais_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dais_admin
      MINIO_ROOT_PASSWORD: dais_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:7
    container_name: dais_redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: dais_adminer
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  minio_data:
